<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Book a meeting · Hype Vision</title>
<link rel="icon" href="/img/icon-32.png">
<style>
:root{--bg:#f6f8fb;--card:#fff;--txt:#0f172a;--mut:#64748b;--line:#e5e9f0;--pri:#0b2448;--acc:#0891b2;--accbg:#ecfeff}
*{box-sizing:border-box}html,body{overflow-x:hidden}body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:28px 16px 60px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:22px}.top img{height:30px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;overflow:hidden;min-width:0;box-shadow:0 1px 2px rgba(15,23,42,.04)}
h1{font-size:22px;margin:0 0 6px}p.s{color:var(--mut);margin:0 0 20px}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;scrollbar-width:thin}
.day{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;text-align:center;cursor:pointer;min-width:74px;font:inherit;color:inherit}
.day b{display:block;font-size:18px}.day small{color:var(--mut);font-size:12px}
.day.on{border-color:var(--acc);background:var(--accbg);box-shadow:0 0 0 1px var(--acc) inset}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.slot{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 0;font:600 15px/1 inherit;cursor:pointer;color:var(--txt)}
.slot:hover{border-color:var(--acc)}.slot.on{background:var(--pri);color:#fff;border-color:var(--pri)}
form{display:none;margin-top:22px;border-top:1px solid var(--line);padding-top:20px}form.show{display:block}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:12px}
input,textarea{display:block;width:100%;margin-top:5px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;color:var(--txt);background:#fff}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}@media(max-width:560px){.g2{grid-template-columns:1fr}}
button.go{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:12px 18px;font:600 15px inherit;cursor:pointer;width:100%}
button.go:disabled{opacity:.6}
.err{color:#b91c1c;font-size:14px;margin-top:10px}.ok{text-align:center;padding:30px 10px}.ok .i{font-size:44px}
.foot{color:var(--mut);font-size:12px;text-align:center;margin-top:18px}
.sum{background:var(--accbg);border-radius:10px;padding:10px 12px;margin-bottom:14px;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><img src="/img/logo-dark.png" alt="Hype Vision" onerror="this.src='/img/logo-light.png'"></div>
  <div class="card" id="app"><p class="s">Loading…</p></div>
  <div class="foot" id="tz">hypevisionlab.com</div>
</div>
<script>
const tok = location.pathname.split('/').filter(Boolean).pop();
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// Saatler ziyaretçinin kendi saat diliminde gösterilir (sunucu ISO/UTC gönderir)
const TZ = Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC';
const fmt = (iso, o) => new Intl.DateTimeFormat('en-GB', { timeZone: TZ, ...o }).format(new Date(iso));
const hm = iso => fmt(iso, { hour: '2-digit', minute: '2-digit', hour12: false });
const dkey = iso => new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date(iso));
const full = iso => fmt(iso, { weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit', hour12: false });
document.getElementById('tz').textContent = `Times are shown in your time zone (${TZ}) · hypevisionlab.com`;
let D, days = [], day = 0, pick = null;
function load() {
  return fetch('/api/public/booking/' + tok).then(r => r.ok ? r.json() : Promise.reject()).then(d => {
    D = d; const by = {};
    for (const x of d.days) for (const s of x.slots) (by[dkey(s)] ||= []).push(s);
    days = Object.keys(by).sort().map(k => ({ day: k, first: by[k][0], slots: by[k] }));
    if (day >= days.length) day = 0; draw();
  });
}
load().catch(() => app.innerHTML = '<h1>Invalid link</h1><p class="s">This booking link is not valid. Please write to info@hypevisionlab.com.</p>');
function draw() {
  if (!days.length) { app.innerHTML = '<h1>No times available</h1><p class="s">The coming days are fully booked. Please reply to our email and we will find a time.</p>'; return; }
  const dd = days[day];
  app.innerHTML = `<h1>${esc(D.title)}</h1>
    <p class="s">${D.name ? 'Hi ' + esc(D.name.split(' ')[0]) + ', p' : 'P'}ick a time for a ${D.dur}-minute online presentation. We'll show you live what AI can detect with your existing cameras.</p>
    ${D.existing_iso ? `<div class="sum">You already have a meeting booked: <b>${esc(full(D.existing_iso))}</b>. Choosing a new time creates an additional meeting.</div>` : ''}
    <div class="days">${days.map((x, i) => `<button class="day ${i === day ? 'on' : ''}" data-d="${i}"><small>${fmt(x.first, { weekday: 'short' })}</small><b>${fmt(x.first, { day: 'numeric' })}</b><small>${fmt(x.first, { month: 'short' })}</small></button>`).join('')}</div>
    <div class="slots">${dd.slots.map(s => `<button class="slot ${s === pick ? 'on' : ''}" data-s="${s}">${hm(s)}</button>`).join('')}</div>
    <form id="f" class="${pick ? 'show' : ''}">
      <div class="sum" id="sel"></div>
      <div class="g2"><label>Full name<input name="name" required value="${esc(D.name)}" ${D.general ? '' : 'readonly'}></label><label>Company<input name="company" required value="${esc(D.company)}" ${D.general ? '' : 'readonly'}></label></div>
      <div class="g2"><label>Email<input name="email" type="email" required value="${esc(D.email)}"></label><label>Phone (optional)<input name="phone" type="tel"></label></div>
      <label>What would you like to discuss? (optional)<textarea name="note" rows="3" placeholder="e.g. forklift safety in the warehouse, PPE compliance, line downtime…"></textarea></label>
      <button class="go" id="go">Confirm meeting</button><div class="err" id="err"></div>
    </form>`;
  if (pick) document.getElementById('sel').innerHTML = `Selected: <b>${esc(full(pick))}</b> (${D.dur} min)`;
  app.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { day = +b.dataset.d; draw(); });
  app.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { pick = b.dataset.s; draw(); document.getElementById('f').scrollIntoView({ behavior: 'smooth', block: 'start' }); });
  const f = document.getElementById('f');
  f.onsubmit = async e => {
    e.preventDefault(); const go = document.getElementById('go'); go.disabled = true; go.textContent = 'Confirming…';
    const body = Object.fromEntries(new FormData(f)); body.start = pick;
    try {
      const r = await fetch('/api/public/booking/' + tok, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      const j = await r.json();
      if (!r.ok) throw Object.assign(new Error(j.error || 'Something went wrong'), { code: r.status });
      app.innerHTML = `<div class="ok"><div class="i">✅</div><h1>Meeting booked</h1><p class="s">${esc(full(pick))} (${esc(TZ)}). A calendar invitation has been sent to <b>${esc(body.email)}</b>.${j.meet ? `<br>Link: <a href="${esc(j.meet)}">${esc(j.meet)}</a>` : ''}</p><p class="s"><a href="/brief">See what to expect in the session →</a></p><p class="s">Talk soon!</p></div>`;
    } catch (er) {
      document.getElementById('err').textContent = er.message; go.disabled = false; go.textContent = 'Confirm meeting';
      if (er.code === 409) { pick = null; load(); }
    }
  };
}
</script>
</body>
</html>
